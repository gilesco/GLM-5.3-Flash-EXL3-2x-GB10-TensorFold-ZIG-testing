<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="1000" height="390" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">

  <text x="12" y="18" font-size="14.5" font-weight="700" fill="#e6edf3">The fronts — this line vs production 0.6.6 (same harness</text>
  <text x="603" y="18" font-size="10.5" fill="#8b949e" text-anchor="middle">production = 100%</text>

  <!-- rows: label | bar | % + raw values; higher is always better (time metrics inverted) -->
  <g>
    <text x="12" y="51.5" font-size="12.5" fill="#9fb1c9">loading (warm restart wall)</text>
    <rect x="270" y="34" width="123" height="26" rx="4" fill="#d29922"/>
    <text x="401" y="51.5" font-size="13.5" font-weight="700" fill="#d29922">37%</text>
    <text x="433" y="51.5" font-size="10" fill="#8b949e">256 s vs 93.7 s</text>
    <text x="12" y="91.5" font-size="12.5" fill="#9fb1c9">decode solo (2048-token, measured)</text>
    <rect x="270" y="74" width="370" height="26" rx="4" fill="#3fb950"/>
    <text x="648" y="91.5" font-size="13.5" font-weight="700" fill="#3fb950">111%</text>
    <text x="689" y="91.5" font-size="10" fill="#8b949e">64.8 vs 58.6 t/s</text>
    <text x="12" y="131.5" font-size="12.5" fill="#9fb1c9">decode c2 aggregate (measured)</text>
    <rect x="270" y="114" width="413" height="26" rx="4" fill="#3fb950"/>
    <text x="691" y="131.5" font-size="13.5" font-weight="700" fill="#3fb950">124%</text>
    <text x="732" y="131.5" font-size="10" fill="#8b949e">108.0 vs 87.0 t/s</text>
    <text x="12" y="171.5" font-size="12.5" fill="#9fb1c9">decode c4 aggregate (measured)</text>
    <rect x="270" y="154" width="360" height="26" rx="4" fill="#3fb950"/>
    <text x="638" y="171.5" font-size="13.5" font-weight="700" fill="#3fb950">108%</text>
    <text x="679" y="171.5" font-size="10" fill="#8b949e">167.4 vs 154.6 t/s</text>
    <text x="12" y="211.5" font-size="12.5" fill="#9fb1c9">request overhead (TTFT, 1-token, solo)</text>
    <rect x="270" y="194" width="420" height="26" rx="4" fill="#3fb950"/>
    <text x="698" y="211.5" font-size="13.5" font-weight="700" fill="#3fb950">126%</text>
    <text x="739" y="211.5" font-size="10" fill="#8b949e">148 vs 186 ms</text>
    <text x="12" y="251.5" font-size="12.5" fill="#9fb1c9">TTFT at depth (1-token, d8192)</text>
    <rect x="270" y="234" width="10" height="26" rx="4" fill="#d29922"/>
    <text x="288" y="251.5" font-size="13.5" font-weight="700" fill="#d29922">3%</text>
    <text x="311" y="251.5" font-size="10" fill="#8b949e">4,954 vs 142 ms</text>
    <text x="12" y="291.5" font-size="12.5" fill="#9fb1c9">prefill (benchy pp2048 @ d0)</text>
    <rect x="270" y="274" width="260" height="26" rx="4" fill="#d29922"/>
    <text x="538" y="291.5" font-size="13.5" font-weight="700" fill="#d29922">78%</text>
    <text x="570" y="291.5" font-size="10" fill="#8b949e">1,177 vs 1,514 tok/s</text>
    <text x="12" y="331.5" font-size="12.5" fill="#9fb1c9">streaming latency per token (ITL)</text>
    <rect x="270" y="314" width="640" height="26" rx="4" fill="#3fb950"/>
    <text x="900" y="331.5" font-size="13.5" font-weight="700" fill="#1a1f24" text-anchor="end">192%</text>
    <text x="849" y="331.5" font-size="10" fill="#1a1f24" text-anchor="end">8.9 vs 17.1 ms/token</text>
  </g>

  <!-- the 100% line -->
  <line x1="603" y1="26" x2="603" y2="348" stroke="#8b949e" stroke-opacity="0.55" stroke-dasharray="4 4"/>

  <text x="12" y="370" font-size="10" fill="#8b949e">Yellow = open fronts; green = won. Higher is always better (time metrics inverted). Receipts (2026-10-27): the served default (top4cfg) on engine v1.1.6 (eea9dc9c): the duel, gates and</text>

</svg>
