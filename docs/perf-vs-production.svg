<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">

  <text x="12" y="18" font-size="14.5" font-weight="700" fill="#e6edf3">The fronts — this line vs production 0.6.6 (same harness</text>
  <text x="609" y="18" font-size="10.5" fill="#8b949e" text-anchor="middle">production = 100%</text>

  <!-- rows: label | bar | % + raw values; higher is always better (time metrics inverted) -->
  <g>
    <text x="12" y="51.5" font-size="12.5" fill="#9fb1c9">loading (warm restart wall)</text>
    <rect x="270" y="34" width="91" height="26" rx="4" fill="#d29922"/>
    <text x="369" y="51.5" font-size="13.5" font-weight="700" fill="#d29922">27%</text>
    <text x="401" y="51.5" font-size="10" fill="#8b949e">344 s vs 93.7 s</text>
    <text x="12" y="91.5" font-size="12.5" fill="#9fb1c9">decode solo (2048-token, measured)</text>
    <rect x="270" y="74" width="366" height="26" rx="4" fill="#3fb950"/>
    <text x="644" y="91.5" font-size="13.5" font-weight="700" fill="#3fb950">108%</text>
    <text x="685" y="91.5" font-size="10" fill="#8b949e">63.6 vs 58.7 t/s</text>
    <text x="12" y="131.5" font-size="12.5" fill="#9fb1c9">decode c2 aggregate (measured)</text>
    <rect x="270" y="114" width="349" height="26" rx="4" fill="#3fb950"/>
    <text x="627" y="131.5" font-size="13.5" font-weight="700" fill="#3fb950">103%</text>
    <text x="668" y="131.5" font-size="10" fill="#8b949e">90.0 vs 87.1 t/s</text>
    <text x="12" y="171.5" font-size="12.5" fill="#9fb1c9">decode c4 aggregate (measured)</text>
    <rect x="270" y="154" width="264" height="26" rx="4" fill="#d29922"/>
    <text x="542" y="171.5" font-size="13.5" font-weight="700" fill="#d29922">78%</text>
    <text x="574" y="171.5" font-size="10" fill="#8b949e">120.4 vs 154.5 t/s</text>
    <text x="12" y="211.5" font-size="12.5" fill="#9fb1c9">request overhead (TTFT, 1-token, solo)</text>
    <rect x="270" y="194" width="403" height="26" rx="4" fill="#3fb950"/>
    <text x="681" y="211.5" font-size="13.5" font-weight="700" fill="#3fb950">119%</text>
    <text x="722" y="211.5" font-size="10" fill="#8b949e">154 vs 183 ms</text>
    <text x="12" y="251.5" font-size="12.5" fill="#9fb1c9">prefill slope (ms/token)</text>
    <rect x="270" y="234" width="152" height="26" rx="4" fill="#d29922"/>
    <text x="430" y="251.5" font-size="13.5" font-weight="700" fill="#d29922">45%</text>
    <text x="462" y="251.5" font-size="10" fill="#8b949e">0.593 vs 0.265 ms/token</text>
    <text x="12" y="291.5" font-size="12.5" fill="#9fb1c9">streaming latency per token (ITL)</text>
    <rect x="270" y="274" width="640" height="26" rx="4" fill="#3fb950"/>
    <text x="900" y="291.5" font-size="13.5" font-weight="700" fill="#1a1f24" text-anchor="end">189%</text>
    <text x="849" y="291.5" font-size="10" fill="#1a1f24" text-anchor="end">9.0 vs 17.0 ms/token</text>
  </g>

  <!-- the 100% line -->
  <line x1="609" y1="26" x2="609" y2="308" stroke="#8b949e" stroke-opacity="0.55" stroke-dasharray="4 4"/>

  <text x="12" y="330" font-size="10" fill="#8b949e">Yellow = open fronts; green = won. Higher is always better (time metrics inverted). Receipts (2026-10-24): the served default is now the top4cfg checkpoint (num_experts_per_tok 4,</text>

</svg>
