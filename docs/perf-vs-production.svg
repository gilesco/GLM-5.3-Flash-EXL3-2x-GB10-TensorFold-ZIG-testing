<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">

  <text x="12" y="18" font-size="14.5" font-weight="700" fill="#e6edf3">The fronts — this line vs production 0.6.6 (same harness</text>
  <text x="478" y="18" font-size="10.5" fill="#8b949e" text-anchor="middle">production = 100%</text>

  <!-- rows: label | bar | % + raw values; higher is always better (time metrics inverted) -->
  <g>
    <text x="12" y="51.5" font-size="12.5" fill="#9fb1c9">loading (warm restart wall)</text>
    <rect x="270" y="34" width="206" height="26" rx="4" fill="#d29922"/>
    <text x="484" y="51.5" font-size="13.5" font-weight="700" fill="#d29922">99%</text>
    <text x="516" y="51.5" font-size="10" fill="#8b949e">95 s vs 93.7 s</text>
    <text x="12" y="91.5" font-size="12.5" fill="#9fb1c9">decode solo (2048-token, measured)</text>
    <rect x="270" y="74" width="193" height="26" rx="4" fill="#d29922"/>
    <text x="471" y="91.5" font-size="13.5" font-weight="700" fill="#d29922">93%</text>
    <text x="503" y="91.5" font-size="10" fill="#8b949e">54.9 vs 58.9 t/s</text>
    <text x="12" y="131.5" font-size="12.5" fill="#9fb1c9">decode c2 aggregate (measured)</text>
    <rect x="270" y="114" width="166" height="26" rx="4" fill="#d29922"/>
    <text x="444" y="131.5" font-size="13.5" font-weight="700" fill="#d29922">80%</text>
    <text x="476" y="131.5" font-size="10" fill="#8b949e">89.0 vs 110.6 t/s</text>
    <text x="12" y="171.5" font-size="12.5" fill="#9fb1c9">decode c4 aggregate (measured)</text>
    <rect x="270" y="154" width="156" height="26" rx="4" fill="#d29922"/>
    <text x="434" y="171.5" font-size="13.5" font-weight="700" fill="#d29922">75%</text>
    <text x="466" y="171.5" font-size="10" fill="#8b949e">144.9 vs 192.6 t/s</text>
    <text x="12" y="211.5" font-size="12.5" fill="#9fb1c9">request overhead (TTFT, 1-token, solo)</text>
    <rect x="270" y="194" width="191" height="26" rx="4" fill="#d29922"/>
    <text x="469" y="211.5" font-size="13.5" font-weight="700" fill="#d29922">92%</text>
    <text x="501" y="211.5" font-size="10" fill="#8b949e">200 vs 185 ms</text>
    <text x="12" y="251.5" font-size="12.5" fill="#9fb1c9">TTFT at depth, COLD (1-token, d8192, novel fill)</text>
    <rect x="270" y="234" width="640" height="26" rx="4" fill="#3fb950"/>
    <text x="900" y="251.5" font-size="13.5" font-weight="700" fill="#1a1f24" text-anchor="end">308%</text>
    <text x="849" y="251.5" font-size="10" fill="#1a1f24" text-anchor="end">5,570 vs 17,129 ms</text>
    <text x="12" y="291.5" font-size="12.5" fill="#9fb1c9">TTFT at depth, WARM (1-token, d8192, cache hit)</text>
    <rect x="270" y="274" width="31" height="26" rx="4" fill="#d29922"/>
    <text x="309" y="291.5" font-size="13.5" font-weight="700" fill="#d29922">15%</text>
    <text x="341" y="291.5" font-size="10" fill="#8b949e">1,422 vs ~212 ms</text>
    <text x="12" y="331.5" font-size="12.5" fill="#9fb1c9">prefill (benchy pp2048 @ d0)</text>
    <rect x="270" y="314" width="143" height="26" rx="4" fill="#d29922"/>
    <text x="421" y="331.5" font-size="13.5" font-weight="700" fill="#d29922">69%</text>
    <text x="453" y="331.5" font-size="10" fill="#8b949e">1,049 vs 1,518 tok/s</text>
    <text x="12" y="371.5" font-size="12.5" fill="#9fb1c9">streaming latency per token (ITL)</text>
    <rect x="270" y="354" width="212" height="26" rx="4" fill="#3fb950"/>
    <text x="490" y="371.5" font-size="13.5" font-weight="700" fill="#3fb950">102%</text>
    <text x="531" y="371.5" font-size="10" fill="#8b949e">16.6 vs 17.0 ms/token</text>
  </g>

  <!-- the 100% line -->
  <line x1="478" y1="26" x2="478" y2="388" stroke="#8b949e" stroke-opacity="0.55" stroke-dasharray="4 4"/>

  <text x="12" y="410" font-size="10" fill="#8b949e">Yellow = open fronts; green = won. Higher is always better (time metrics inverted). Receipts (2026-10-31): the served default is the Focus checkpoint (round 38 (user) swap): the Focus</text>

</svg>
