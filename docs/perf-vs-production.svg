<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="920" height="280" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">

  <text x="10" y="16" font-size="12" font-weight="600" fill="#e6edf3">The three fronts — this line vs production 0.6.6 (same harness, 2026-10-23 receipts)</text>
  <text x="750" y="16" font-size="9.5" fill="#8b949e" text-anchor="middle">production = 100%</text>

  <!-- rows: label | bar | % + raw values; higher is always better (time metrics inverted) -->
  <g font-size="10.5" fill="#9fb1c9">
    <text x="10" y="44.5">loading (warm restart)</text>
    <rect x="150" y="30" width="210" height="20" rx="3" fill="#d29922"/>
    <text x="366" y="44.5" font-weight="600" fill="#d29922">35%</text>
    <text x="405" y="44.5" font-size="8.5" fill="#8b949e">265 s vs 93.7 s</text>

    <text x="10" y="80.5">prefill (pp2048)</text>
    <rect x="150" y="66" width="402" height="20" rx="3" fill="#d29922"/>
    <text x="558" y="80.5" font-weight="600" fill="#d29922">67%</text>
    <text x="596" y="80.5" font-size="8.5" fill="#8b949e">1,026 vs 1,530 t/s</text>

    <text x="10" y="116.5">TTFT (d0)</text>
    <rect x="150" y="102" width="402" height="20" rx="3" fill="#d29922"/>
    <text x="558" y="116.5" font-weight="600" fill="#d29922">67%</text>
    <text x="596" y="116.5" font-size="8.5" fill="#8b949e">1,997 vs 1,339 ms</text>

    <text x="10" y="152.5">decode solo (bench tg128)</text>
    <rect x="150" y="138" width="582" height="20" rx="3" fill="#d29922"/>
    <text x="738" y="152.5" font-weight="600" fill="#d29922">97%</text>
    <text x="776" y="152.5" font-size="8.5" fill="#8b949e">49.9 vs 51.6 t/s</text>

    <text x="10" y="188.5">decode solo (steady)</text>
    <rect x="150" y="174" width="624" height="20" rx="3" fill="#3fb950"/>
    <text x="780" y="188.5" font-weight="600" fill="#3fb950">104%</text>
    <text x="818" y="188.5" font-size="8.5" fill="#8b949e">~54 vs ~52 t/s</text>

    <text x="10" y="224.5">decode c4 aggregate (steady)</text>
    <rect x="150" y="210" width="606" height="20" rx="3" fill="#3fb950"/>
    <text x="762" y="224.5" font-weight="600" fill="#3fb950">101%</text>
    <text x="800" y="224.5" font-size="8.5" fill="#8b949e">99–110 vs ~104 t/s</text>
  </g>

  <!-- the 100% line -->
  <line x1="750" y1="24" x2="750" y2="236" stroke="#8b949e" stroke-opacity="0.55" stroke-dasharray="4 4"/>

  <text x="10" y="262" font-size="8.5" fill="#8b949e">Yellow = open fronts; green = won. Higher is always better (time metrics inverted). Receipts: campaigns 110446 / 093827 / 145449 + the restart walls in the campaign logs.</text>

</svg>
