<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="1000" height="390" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">

  <text x="12" y="18" font-size="14.5" font-weight="700" fill="#e6edf3">The fronts — this line vs production 0.6.6 (same harness</text>
  <text x="620" y="18" font-size="10.5" fill="#8b949e" text-anchor="middle">production = 100%</text>

  <!-- rows: label | bar | % + raw values; higher is always better (time metrics inverted) -->
  <g>
    <text x="12" y="51.5" font-size="12.5" fill="#9fb1c9">loading (warm restart wall)</text>
    <rect x="270" y="34" width="346" height="26" rx="4" fill="#d29922"/>
    <text x="624" y="51.5" font-size="13.5" font-weight="700" fill="#d29922">99%</text>
    <text x="656" y="51.5" font-size="10" fill="#8b949e">95 s vs 93.7 s</text>
    <text x="12" y="91.5" font-size="12.5" fill="#9fb1c9">decode solo (2048-token, measured)</text>
    <rect x="270" y="74" width="326" height="26" rx="4" fill="#d29922"/>
    <text x="604" y="91.5" font-size="13.5" font-weight="700" fill="#d29922">93%</text>
    <text x="636" y="91.5" font-size="10" fill="#8b949e">54.9 vs 58.9 t/s</text>
    <text x="12" y="131.5" font-size="12.5" fill="#9fb1c9">decode c2 aggregate (measured)</text>
    <rect x="270" y="114" width="280" height="26" rx="4" fill="#d29922"/>
    <text x="558" y="131.5" font-size="13.5" font-weight="700" fill="#d29922">80%</text>
    <text x="590" y="131.5" font-size="10" fill="#8b949e">89.0 vs 110.6 t/s</text>
    <text x="12" y="171.5" font-size="12.5" fill="#9fb1c9">decode c4 aggregate (measured)</text>
    <rect x="270" y="154" width="262" height="26" rx="4" fill="#d29922"/>
    <text x="540" y="171.5" font-size="13.5" font-weight="700" fill="#d29922">75%</text>
    <text x="572" y="171.5" font-size="10" fill="#8b949e">144.9 vs 192.6 t/s</text>
    <text x="12" y="211.5" font-size="12.5" fill="#9fb1c9">request overhead (TTFT, 1-token, solo)</text>
    <rect x="270" y="194" width="322" height="26" rx="4" fill="#d29922"/>
    <text x="600" y="211.5" font-size="13.5" font-weight="700" fill="#d29922">92%</text>
    <text x="632" y="211.5" font-size="10" fill="#8b949e">200 vs 185 ms</text>
    <text x="12" y="251.5" font-size="12.5" fill="#9fb1c9">TTFT at depth (1-token, d8192)</text>
    <rect x="270" y="234" width="147" height="26" rx="4" fill="#d29922"/>
    <text x="425" y="251.5" font-size="13.5" font-weight="700" fill="#d29922">42%</text>
    <text x="457" y="251.5" font-size="10" fill="#8b949e">5,570 vs 2,363 ms</text>
    <text x="12" y="291.5" font-size="12.5" fill="#9fb1c9">prefill (benchy pp2048 @ d0)</text>
    <rect x="270" y="274" width="242" height="26" rx="4" fill="#d29922"/>
    <text x="520" y="291.5" font-size="13.5" font-weight="700" fill="#d29922">69%</text>
    <text x="552" y="291.5" font-size="10" fill="#8b949e">1,049 vs 1,518 tok/s</text>
    <text x="12" y="331.5" font-size="12.5" fill="#9fb1c9">streaming latency per token (ITL)</text>
    <rect x="270" y="314" width="357" height="26" rx="4" fill="#3fb950"/>
    <text x="635" y="331.5" font-size="13.5" font-weight="700" fill="#3fb950">102%</text>
    <text x="676" y="331.5" font-size="10" fill="#8b949e">16.6 vs 17.0 ms/token</text>
  </g>

  <!-- the 100% line -->
  <line x1="620" y1="26" x2="620" y2="348" stroke="#8b949e" stroke-opacity="0.55" stroke-dasharray="4 4"/>

  <text x="12" y="370" font-size="10" fill="#8b949e">Yellow = open fronts; green = won. Higher is always better (time metrics inverted). Receipts (2026-10-31): the served default is the Focus checkpoint (round 38 (user) swap): the Focus</text>

</svg>
